<header class="header-bar">
  <div class="header-container">

    <a routerLink="/" class="brand-area">
      <img src="/imagens/logo.png" alt="Logo Pudim da Didi" class="logo-img" />
      <div class="brand-text">
        <span class="logo-nome">Pudim da Didi</span>
        <span class="logo-sub">Pudins Artesanais</span>
      </div>
    </a>

    <nav class="nav-center">
      <a href="#produtos" class="nav-link-item">Produtos</a>
      <a href="#sobre" class="nav-link-item">Sobre</a>
      <a href="#contato" class="nav-link-item">Contato</a>
    </nav>

    <div class="nav-right">
      @if (!auth.isLogado()) {
        <a routerLink="/login" class="icon-btn">
          <mat-icon>account_circle</mat-icon>
        </a>
      } @else {
        @if (auth.isVendedor()) {
          <a routerLink="/vendedor/dashboard" class="btn-entrar">Painel</a>
        }
        <a routerLink="/meus-pedidos" class="btn-entrar">Meus Pedidos</a>
        <button class="btn-sair" (click)="auth.logout()">Sair</button>
      }
      <a routerLink="/carrinho" class="icon-btn">
        <span class="cart-wrapper">
          <mat-icon>shopping_cart</mat-icon>
          @if (cartCount > 0) {
            <span class="cart-badge">{{ cartCount }}</span>
          }
        </span>
      </a>
    </div>
  </div>
</header>
