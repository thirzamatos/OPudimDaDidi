<div class="auth-container">
    <div class="auth-card">

        <div class="auth-logo">
            <img src="/imagens/logo.png" alt="Logo">
        </div>

        <h2>Criar Conta</h2>
        <p class="auth-sub">Faça parte da família Pudim da Didi!</p>

        @if (erro) {
            <div class="erro-msg">
                <mat-icon>error_outline</mat-icon>
                {{erro}}
            </div>
        }

        <div class="form-group">
            <label>Nome</label>
            <input type="text" [(ngModel)]="nome" placeholder="Seu nome completo" class="form-input">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="email" placeholder="Seu email aqui" class="form-input">
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" [(ngModel)]="senha" placeholder="Mínimo 6 caracteres" class="form-input">
        </div>

        <div class="form-group">
            <label>Confirmar Senha</label>
            <input type="password" [(ngModel)]="confirmarSenha" placeholder="Repita sua senha" class="form-input">
        </div>

        <button class="btn-auth" (click)="cadastrar()" [disabled]="carregando">
            @if (carregando) {Cadastrando...} @else {Criar Conta}
        </button>

        <p class="auth-link">
            Já tem conta? <a routerLink="/login">Entrar</a>
        </p>
    </div>
</div>
