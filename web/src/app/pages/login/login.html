<div class="auth-container">
    <div class="auth-card">

        <div class="auth-logo">
            <img src="/imagens/logo.png" alt="Logo">
        </div>

        <h2>Entrar</h2>
        <p class="auth-sub">Bem vindo de volta!</p>

        @if (erro) {
            <div class="erro-msg">
                <mat-icon>error_outline</mat-icon>
                {{erro}}
            </div>
        }

        <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="email" placeholder="Email" class="form-input">
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" [(ngModel)]="senha" placeholder="Senha" class="form-input">
        </div>

        <button class="btn-auth" (click)="entrar()" [disabled]="carregando">
            @if (carregando) {
                Entrando...
            } @else {
                Entrar
            }
        </button>

        <p class="auth-link">Não tem conta? <a routerLink="/cadastro">Cadastre-se</a></p>
    </div> 
</div>
